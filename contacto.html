<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <header>
        <nav>
            <a href="index.html">PORTADA</a>
            <a href="nosotros.html">NOSOTROS</a>
            <a href="productos.html">PRODUCTOS</a>
            <a href="servicios.html">SERVICIOS</a>
            <a href="contacto.html">CONTACTO</a>
        </nav>
    </header>

    <main>
        <h1>Contacto</h1>
        <p>¿Tienes alguna duda o pedido especial? Escríbenos.</p>

        <section>
            <h2>Formulario de contacto</h2>
            <form action="#" method="post">
                <div>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                </div>

                <div>
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="Ej: juan@correo.com" required>
                </div>

                <div>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: +57 300 000 0000">
                </div>

                <div>
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Ej: Pedido especial">
                </div>

                <div>
                    <label for="mensaje">Mensaje:</label>
                    <input type="text" id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí" required>
                </div>

                <div>
                    <button type="submit">Enviar mensaje</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Galletas [Nombre de la Empresa]. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
